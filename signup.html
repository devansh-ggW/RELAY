<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get started — Relay</title><meta name="description" content="Create a Relay account."><link rel="icon" href="assets/relay-icon.png"><link rel="stylesheet" href="assets/css/styles.css"></head><body><div id="app-shell"></div><main><div class="auth-wrap"><div class="auth-card"><div class="eyebrow"><span class="dot"></span>Create your Relay</div><h1>Start here.</h1><p class="sub">Pick the side you're on. You can switch later from your profile.</p><div class="auth-toggle"><button type="button" class="active" data-role="seeker">Job seeker</button><button type="button" data-role="employer">Employer</button></div><form id="authForm" class="stack"><div class="field"><label class="label">Name</label><input class="input" name="name" placeholder="Your name or company" required></div><div class="field"><label class="label">Email</label><input class="input" name="email" type="email" placeholder="you@example.com" required></div><div class="field"><label class="label">Password</label><input class="input" name="password" type="password" placeholder="••••••••" required></div><button class="btn btn-blue" type="submit">Create account</button></form><div class="small-muted" style="margin-top:17px;text-align:center">Already on Relay? <a href="login.html" style="color:var(--ink);font-weight:800">Log in</a></div></div></div></main><div id="site-footer"></div><script src="assets/js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script></body></html>

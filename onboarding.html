<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finish your profile — Relay</title><link rel="icon" href="assets/relay-icon.svg"><link rel="stylesheet" href="assets/css/styles.css"></head><body><div id="app-shell"></div><main><section class="auth-wrap"><div class="auth-card" style="width:min(620px,100%)"><div class="eyebrow"><span class="dot"></span>One last step</div><h1>Tell Relay who you are.</h1><p class="sub">This information powers your real profile. Keep it accurate — especially your age.</p><form id="onboardingForm" class="form-grid"><div class="field full"><label class="label">Name</label><input class="input" name="name" required></div><div class="field"><label class="label">I am here as</label><select class="select" name="role"><option value="seeker">Job seeker</option><option value="employer">Employer / hiring</option></select></div><div class="field"><label class="label">Age</label><select class="select" id="age" name="age" required><option value="">Select age</option><script>for(let i=18;i<=100;i++)document.write(`<option value="${i}">${i}</option>`)</script></select></div><div class="field"><label class="label">City</label><input class="input" name="city" placeholder="Pune"></div><div class="field"><label class="label">State</label><input class="input" name="state" placeholder="Maharashtra"></div><div class="field full"><label class="label">Headline</label><input class="input" name="headline" placeholder="What do you do or hire for?"></div><div class="field full"><label class="label">Skills</label><input class="input" name="skills" placeholder="JavaScript, Design, Sales"></div><div class="field full"><label class="label">About</label><textarea class="textarea" name="about" placeholder="A short, useful description."></textarea></div><div class="field full" style="gap:10px"><label style="display:flex;gap:9px;align-items:flex-start;font-size:.8rem;color:#444"><input type=

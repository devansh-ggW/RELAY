<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finish your profile — Relay</title><meta name="description" content="Finish your Relay profile.">
<link rel="icon" href="assets/relay-icon.svg"><link rel="stylesheet" href="assets/css/styles.css"></head>
<body><div id="app-shell"></div><main><section class="auth-wrap"><div class="auth-card auth-card-wide">
<div class="eyebrow"><span class="dot"></span>Profile setup</div><h1>Now make it useful.</h1>
<p class="sub">Your account exists. Complete the information people actually need to understand who they're dealing with.</p>
<form id="onboardingForm" class="form-grid">
<div class="field full"><label class="label">Name</label><input class="input" name="name" required></div>
<div class="field"><label class="label">I am here as</label><select class="select" name="role"><option value="seeker">Job seeker</option><option value="employer">Employer / hiring</option></select></div>
<div class="field"><label class="label">Age</label><select class="select" id="onboardingAge" name="age" required><option value="">Select age</option><script>for(let i=18;i<=100;i++){document.write('<option value="'+i+'">'+i+'</option>')}</script></select><small class="small-muted">18+ only. Age is not shown publicly.</small></div>
<div class="field"><label class="label">City</label><input class="input" name="city" placeholder="Pune"></div>
<div class="field"><label class="label">State</label><input class="input" name="state" placeholder="Maharashtra"></div>
<div class="field full"><label class="label">Headline</label><input class="input" name="headline" placeholder="Frontend developer · React · UI"></div>
<div class="field"><label class="label">Experience (years)</label><input class="input" name="experience_years" type="number" min="0" max="70" placeholder="0"></div>
<div class="field"><label class="label">Skills</label><input class="input" name="skills" placeholder="JavaScript, Design, Sales"></div>
<div class="field full"><label class="label">About</label><textarea class="textarea" name="about" placeholder="A concise description of what you do or what you hire for."></textarea></div>
<div class="field full"><div class="consent-box">
<label class="check-row"><input type="checkbox" name="ageTruth" required><span>I confirm that I am 18 or older and that the age I provide is truthful and accurate. False age information violates Relay's rules.</span></label>
<label class="check-row"><input type="checkbox" name="terms" required><span>I agree to Relay's <a href="terms.html"><u>Terms of Service</u></a>.</span></label>
<label class="check-row"><input type="checkbox" name="privacy" required><span>I acknowledge Relay's <a href="privacy.html"><u>Privacy Policy</u></a>.</span></label>
</div></div>
<div class="field full"><button class="btn btn-blue btn-large" type="submit">Finish profile →</button></div>
</form></div></section></main><div id="site-footer"></div>
<script src="assets/js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase.js"></script><script src="assets/js/app.js"></script></body></html>
